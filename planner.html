<form id="task-form">

  <label for="task-input">Task Name</label>

  <input
    type="text"
    id="task-input"
    placeholder="e.g. Complete MTH102 assignment"
    required
  >

  <label for="task-date">Due Date</label>

  <input
    type="date"
    id="task-date"
    required
  >

  <label for="task-time">Due Time</label>

  <input
    type="time"
    id="task-time"
    required
  >

  <button type="submit" class="button primary">
    Add Task
  </button>

</form>
